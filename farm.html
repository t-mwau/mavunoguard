<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm profile | MavunoGuard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="assets/dashboard.css"></head><body class="app-body"><div class="app-shell"><aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MavunoGuard</span></a><p class="nav-label">Workspace</p><nav class="side-nav"><a href="dashboard.html">⌂ &nbsp; Overview</a><a class="active" href="farm.html">▣ &nbsp; Farm profile</a><a href="climate.html">◌ &nbsp; Climate</a><a href="crop-health.html">◈ &nbsp; Crop health</a><a href="advisor.html">✦ &nbsp; AI advisor</a><a href="calendar.html">□ &nbsp; Calendar</a></nav></aside><main class="main-content"><header class="topbar"><button class="icon-button mobile-menu">☰</button><span class="topbar-title">Farm settings</span><div class="profile-chip"><span class="avatar">MK</span><span>Mercy K.</span></div></header><div class="page-wrap"><div class="page-heading"><div><p class="eyebrow">Your source of truth</p><h1>Farm profile</h1><p>Keep your farm context current for better recommendations.</p></div></div><section class="panel full-panel"><form id="farm-form"><div class="form-grid"><label class="field">Farm name<input name="name" required></label><label class="field">Location<input name="location" required></label><label class="field">Primary crop<select name="crop"><option>Maize</option><option>Beans</option><option>Wheat</option><option>Potatoes</option></select></label><label class="field">Farm area (hectares)<input name="area" type="number" step="0.1" required></label><label class="field">Current season<input name="season" required></label></div><div class="form-actions"><button class="button button-dark" type="submit">Save farm profile <span>↗</span></button><span id="save-status" class="save-status"></span></div></form></section></div></main></div><script src="js/app.js"></script><script>const form=document.querySelector('#farm-form');const farm=window.mavunoFarm;Object.entries(farm).forEach(([key,value])=>{if(form.elements[key])form.elements[key].value=value});form.addEventListener('submit',(event)=>{event.preventDefault();window.saveFarm(Object.fromEntries(new FormData(form)));document.querySelector('#save-status').textContent='Saved locally';});document.querySelector('.mobile-menu').addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('is-open'));</script></body></html>
